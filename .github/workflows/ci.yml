name: FarmRelay Supabase checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://test-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-ci-placeholder
      - run: npm audit --audit-level=high
